<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier une Actu — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1B2A4A; --brass: #A8853F; --paper: #F7F5F0; --line: rgba(27,42,74,0.1); --gov-purple: #6a4c93; }
  body { font-family: 'Inter', sans-serif; background: var(--paper); padding: 20px; color: var(--ink); }
  .admin-box { background: white; max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  h1 { font-family: 'Source Serif 4', serif; margin-bottom: 20px; }
  label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; }
  input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  textarea { height: 150px; resize: vertical; }
  .btn-publier { background: var(--ink); color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; }
  .btn-publier:disabled { background: #ccc; }
  #status { margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; }
  .news-item { border: 1px solid var(--line); border-radius: 8px; padding: 15px; margin-top: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .news-item h4 { font-size: 15px; margin-bottom: 4px; }
  .news-item p { font-size: 12px; color: #666; }
  .news-item .btn-suppr { background: #d9534f; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .top-nav { background: var(--ink); padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; max-width: 660px; margin-left: auto; margin-right: auto; flex-wrap: wrap; gap: 10px; }
  .top-nav a { color: #fff; text-decoration: none; font-size: 13px; }
  .top-nav a:hover { text-decoration: underline; }

  /* 🎓 GOUVERNEMENT SCOLAIRE */
  .gov-link { display: none; color: #fff !important; font-weight: 700; }
  .gov-link:hover { color: #d4b8ff !important; text-decoration: underline; }
</style>
</head>
<body>

    <!-- Barre de navigation Retour -->
    <div class="top-nav">
        <a href="admin-gestion.html">← Retour à la Gestion</a>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
            <a href="index.html">🏠 Accueil</a>
            <a href="ressources.html">📚 Ressources</a>
            <a href="actualites.html">📰 Actualités</a>

            <!-- 🎓 NOUVEAU : Lien Gouvernement scolaire (visible pour Président/Ministre/Admins) -->
            <a href="publier-annonce.html" class="gov-link">🎓 Gouvernement</a>
        </div>
    </div>

<div class="admin-box" id="admin-content" style="display:none;">
  <h1>Publier une actualité</h1>
  <form id="news-form">
    <label>Titre de l'article</label>
    <input type="text" id="news-title" placeholder="Ex: Cérémonie de remise des prix" required>

    <label>Contenu de l'article</label>
    <textarea id="news-text" placeholder="Écrivez votre article ici..." required></textarea>

    <label>Destinataire</label>
    <select id="news-destinataire" style="padding:10px;width:100%;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;">
      <option value="tous">Tout le monde (site public)</option>
      <option value="eleve">Élèves uniquement</option>
      <option value="professeur">Professeurs uniquement</option>
    </select>

    <label>Image d'illustration (optionnel)</label>
    <input type="file" id="news-file" accept="image/*">

    <button type="submit" class="btn-publier" id="submit-btn">Publier sur le site</button>
  </form>
  <div id="status"></div>
  <p style="text-align:center; margin-top:20px;"><a href="actualites.html" style="color:var(--brass); text-decoration:none;">← Voir les actualités</a></p>

  <h1 style="margin-top:40px; border-top:1px solid var(--line); padding-top:25px;">Actualités publiées</h1>
  <div id="news-list"></div>
</div>

<div id="gate" style="text-align:center; margin-top:100px;">
    <p>Vérification des accès...</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, deleteDoc, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag",
    authDomain: "lfakm-87dec.firebaseapp.com",
    projectId: "lfakm-87dec",
    storageBucket: "lfakm-87dec.firebasestorage.app",
    messagingSenderId: "739517262614",
    appId: "1:739517262614:web:14abd3538427960c527e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ============ COMPRESSION D'IMAGE (comme dans admin-gestion.html) ============
  async function compressImage(file, maxWidth = 1200, quality = 0.8) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) {
        reject(new Error('Fichier non valide (image attendue).'));
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ratio = Math.min(maxWidth / img.width, maxWidth / img.height, 1);
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((blob) => {
            if (!blob) { reject(new Error('Erreur lors de la compression.')); return; }
            resolve({
              blob: blob,
              originalSize: file.size,
              newSize: blob.size,
              dataURL: canvas.toDataURL('image/jpeg', quality)
            });
          }, 'image/jpeg', quality);
        };
        img.onerror = () => reject(new Error('Impossible de lire l\'image.'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('Erreur de lecture du fichier.'));
      reader.readAsDataURL(file);
    });
  }

  // VÉRIFICATION ACCÈS (Proviseur / Censeur / Admin uniquement)
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'utilisateurs', user.uid));
      const role = snap.exists() ? snap.data().role : null;

      // 🎓 Affichage du lien Gouvernement (Président, Ministre, Admins)
      if (['admin', 'proviseur', 'censeur', 'president', 'ministre_communication'].includes(role)) {
        document.querySelectorAll('.gov-link').forEach(el => el.style.display = 'inline');
      } else {
        document.querySelectorAll('.gov-link').forEach(el => el.style.display = 'none');
      }

      if (['admin', 'proviseur', 'censeur'].includes(role)) {
        document.getElementById('admin-content').style.display = 'block';
        document.getElementById('gate').style.display = 'none';
        loadNewsList();
      } else {
        document.getElementById('gate').innerHTML = "<p style='color:red;'>Accès refusé. Réservé au Proviseur et au Censeur.</p>";
      }
    } else {
      window.location.href = 'identification.html';
    }
  });

  // Protection anti-XSS
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function loadNewsList() {
    const list = document.getElementById('news-list');
    onSnapshot(query(collection(db, 'actualites'), orderBy('date', 'desc')), (snap) => {
      list.innerHTML = snap.empty ? '<p style="color:gray;margin-top:12px;">Aucune actualité publiée pour le moment.</p>' : '';
      snap.forEach(d => {
        const n = d.data();
        const date = n.date?.toDate ? n.date.toDate().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
        const item = document.createElement('div');
        item.className = 'news-item';
        const dest = n.destinataire === 'eleve' ? '🎓 Élèves' : n.destinataire === 'professeur' ? '👨‍🏫 Profs' : '🌍 Tous';
        const govBadge = n.sourceGouvernement ? ' <span style="font-size:10px;color:#6a4c93;font-weight:700;">🎓 GOUV.</span>' : '';
        item.innerHTML = `<div><h4>${escapeHtml(n.titre)}${govBadge} <span style="font-size:11px;font-weight:normal;color:#888;">— ${dest}</span></h4><p>${date}</p></div>`;
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-suppr';
        delBtn.textContent = '✕ Supprimer';
        delBtn.onclick = () => confirm(`Supprimer "${n.titre}" ?`) && deleteDoc(doc(db, 'actualites', d.id));
        item.appendChild(delBtn);
        list.appendChild(item);
      });
    });
  }

  // LOGIQUE DE PUBLICATION
  const form = document.getElementById('news-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');
    
    const title = document.getElementById('news-title').value;
    const text = document.getElementById('news-text').value;
    const originalFile = document.getElementById('news-file').files[0];

    if (originalFile && originalFile.size > 15 * 1024 * 1024) {
      status.style.color = "red";
      status.textContent = "❌ Image trop volumineuse (max 15 Mo).";
      return;
    }

    if (originalFile) {
      const usageSnap = await getDoc(doc(db, 'config', 'usage'));
      const moUsed = usageSnap.data()?.totalMo || 0;
      if (moUsed >= 20000) {
        status.style.color = "red";
        status.textContent = "❌ Espace de stockage plein. Publiez l'actualité sans image, ou attendez la remise à zéro annuelle du compteur.";
        return;
      }
    }

    btn.disabled = true;
    status.textContent = "Publication en cours...";

    let imageUrl = "";
    let fileToUpload = originalFile;

    try {
      // 1. Compression automatique de l'image
      if (originalFile) {
        status.textContent = "🗜️ Compression de l'image...";
        const compressed = await compressImage(originalFile, 1200, 0.8);
        fileToUpload = new File(
          [compressed.blob],
          originalFile.name.replace(/\.[^.]+$/, '.jpg'),
          { type: 'image/jpeg' }
        );
        const gain = ((1 - compressed.newSize / compressed.originalSize) * 100).toFixed(0);
        status.textContent = `🗜️ Image compressée (-${gain}%). Upload en cours...`;
      }

      // 2. Upload image vers Cloudinary
      if (fileToUpload) {
        const fd = new FormData();
        fd.append('file', fileToUpload);
        fd.append('upload_preset', 'lfakm_ressources'); 
        const res = await fetch('https://api.cloudinary.com/v1_1/kgjydhyi/auto/upload', { method: 'POST', body: fd });
        const data = await res.json();
        imageUrl = data.secure_url;
        try { 
          await setDoc(doc(db, 'config', 'usage'), 
            { totalMo: increment(fileToUpload.size / (1024 * 1024)) }, 
            { merge: true }
          ); 
        } catch (e) { /* silencieux */ }
      }

      // 3. Enregistrement dans Firestore
      status.textContent = "💾 Enregistrement...";
      await addDoc(collection(db, "actualites"), {
        titre: title,
        contenu: text,
        image: imageUrl,
        destinataire: document.getElementById('news-destinataire').value,
        date: serverTimestamp()
      });

      status.style.color = "green";
      status.textContent = "✅ Actualité publiée avec succès !";
      form.reset();
    } catch (error) {
      status.style.color = "red";
      status.textContent = "❌ Erreur : " + error.message;
    } finally {
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
