<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — LFAKM</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/style-menu.css">
<link rel="stylesheet" href="css/community.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="manifest" href="../assets/manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="author" content="Djiby Tall - LFAKM">

<style>
  :root {
    --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0; --brass: #A8853F;
    --slate: #5B6472; --line: rgba(27,42,74,0.14); --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', sans-serif;
    --success: #2e7d32; --danger: #B3402A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: #1a1a1a; background: var(--paper); line-height:1.55; overflow-x: hidden; }

  /* HERO */
  .page-hero { background: var(--ink-deep); color:#EFE9DC; padding: 50px 0; text-align: center; }
  .page-hero h1 { font-family: var(--serif); font-size: 32px; margin-bottom: 10px; }
  .page-hero p { font-size: 14px; opacity: 0.85; }

  /* LAYOUT */
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 20px; }
  .notifs-container { padding: 30px 0 60px; }

  /* BOUTON "TOUT MARQUER COMME LU" */
  .actions-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .notif-count-badge {
    font-size: 14px;
    color: var(--slate);
    font-weight: 600;
  }
  .notif-count-badge strong {
    color: var(--brass);
    font-size: 18px;
  }
  .btn-mark-all {
    background: var(--brass);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    font-family: var(--sans);
    transition: background 0.2s;
  }
  .btn-mark-all:hover { background: #96743a; }
  .btn-mark-all:disabled { opacity: 0.5; cursor: not-allowed; }

  /* FILTRES */
  .filters-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: #fff;
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    font-family: var(--sans);
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--brass); }
  .filter-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* LISTE NOTIFICATIONS */
  .notifs-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .notif-item-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
    position: relative;
  }

  .notif-item-card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }

  .notif-item-card.non-lu {
    background: #fef9f0;
    border-left: 4px solid var(--brass);
  }

  .notif-item-card.non-lu:hover {
    border-color: var(--brass);
  }

  .notif-icon-box {
    font-size: 24px;
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9f7f2;
    border-radius: 10px;
  }

  .notif-content {
    flex: 1;
    min-width: 0;
  }

  .notif-message {
    font-size: 14px;
    color: var(--ink);
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .notif-message strong {
    color: var(--brass);
    font-weight: 700;
  }

  .notif-date {
    font-size: 11px;
    color: var(--slate);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .non-lu-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--brass);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .notif-delete-btn {
    background: transparent;
    border: none;
    color: var(--slate);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }

  .notif-delete-btn:hover {
    background: #fdecea;
    color: var(--danger);
  }

  /* EMPTY / LOADER */
  .empty-state {
    text-align: center;
    color: var(--slate);
    padding: 60px 20px;
    font-size: 14px;
    background: #fff;
    border-radius: 10px;
    border: 1px dashed var(--line);
  }
  .empty-state .icon { font-size: 48px; display: block; margin-bottom: 15px; }
  .loader { text-align: center; padding: 40px; color: var(--slate); font-style: italic; }

  /* FOOTER */
  footer {
    background: var(--ink-deep); color: #B7BCC9; padding: 25px 20px 20px;
    text-align: center; font-size: 12px; margin-top: 30px;
  }

  @media (max-width: 500px) {
    .page-hero h1 { font-size: 24px; }
    .notif-icon-box { width: 40px; height: 40px; font-size: 20px; }
    .notif-message { font-size: 13px; }
  }
</style>
</head>
<body>

<section class="page-hero">
  <div class="wrap">
    <h1>🔔 Notifications</h1>
    <p>Toutes tes notifications en un seul endroit.</p>
  </div>
</section>

<main class="wrap notifs-container">

  <div class="actions-top">
    <div class="notif-count-badge">
      <strong id="non-lues-count">0</strong> non lue<span id="plural-s">s</span>
    </div>
    <button class="btn-mark-all" id="btn-mark-all">
      ✅ Tout marquer comme lu
    </button>
  </div>

  <div class="filters-row">
    <button class="filter-btn active" data-filter="all">Toutes</button>
    <button class="filter-btn" data-filter="non-lues">Non lues</button>
    <button class="filter-btn" data-filter="reponses">💬 Réponses</button>
    <button class="filter-btn" data-filter="likes">👍 Likes</button>
    <button class="filter-btn" data-filter="commentaires">📝 Commentaires</button>
  </div>

  <div id="notifs-list" class="notifs-list">
    <div class="loader">⏳ Chargement des notifications...</div>
  </div>

</main>

<footer style="background: var(--ink-deep, #10192E); color: #B7BCC9; padding: 25px 20px 20px; text-align: center; font-size: 12px; margin-top: 30px;">
  <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 15px; margin-bottom: 10px;">
    <a href="index.html" style="color: #A8853F; text-decoration: none; font-weight: 700;">👥 Communauté</a>
    <a href="#" onclick="window.showContact(); return false;" style="color: #B7BCC9; text-decoration: none;">📞 Contacter le Proviseur</a>
  </div>
  <div style="font-size: 11px; opacity: 0.7;">
    © 2026 Lycée Franco Arabe de Keur Madiabel — Site conçu par <strong>Djiby Tall</strong>
  </div>
</footer>

<script type="module">
  import { initialiserMenuComplet } from './js/menu.js';
  await initialiserMenuComplet();
  import './js/notifications-page.js';
</script>
</body>
</html>
