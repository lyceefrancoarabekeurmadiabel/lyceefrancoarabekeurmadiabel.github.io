<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optique — Young & Prisme | LFAKM</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #eee;
    padding: 8px;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }

  body.loaded { visibility: visible; opacity: 1; }

  /* ===== CONTENEUR PRINCIPAL : tout tient sur un écran ===== */
  .app {
    height: 100vh;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    max-width: 1400px;
    margin: 0 auto;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
  }

  /* ===== BARRE DU HAUT : titre + onglets + actions ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: nowrap;
    flex-shrink: 0;
  }

  .topbar-title {
    color: #4fc3f7;
    font-size: 1.05em;
    font-weight: bold;
    white-space: nowrap;
  }

  .topbar-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-mini {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.72em;
    font-weight: 700;
    text-decoration: none;
    transition: 0.2s;
    white-space: nowrap;
  }

  .btn-mini-retour {
    background: rgba(168, 133, 63, 0.2);
    color: #ffd54f;
    border: 1px solid rgba(255, 213, 79, 0.4);
  }

  .btn-mini-mobile {
    background: rgba(79, 195, 247, 0.15);
    color: #4fc3f7;
    border: 1px solid rgba(79, 195, 247, 0.4);
  }

  /* ===== ONGLETS ===== */
  .tabs {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .tab {
    flex: 1;
    padding: 6px 12px;
    background: rgba(255,255,255,0.05);
    border: 2px solid transparent;
    border-radius: 8px;
    color: #888;
    font-size: 0.82em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .tab:hover { color: #4fc3f7; }
  .tab.active {
    background: rgba(79, 195, 247, 0.15);
    color: #4fc3f7;
    border-color: #4fc3f7;
  }

  .tab-content {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    gap: 6px;
  }

  .tab-content.active {
    display: flex;
  }

  /* ===== ZONE CENTRALE : dispositif + écran/profil ===== */
  .viz-zone {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-height: 0;
  }

  /* Dispositif (haut, hauteur fixe compacte) */
  .setup-zone {
    flex: 0 0 auto;
    background: #000;
    border-radius: 8px;
    border: 2px solid #4fc3f7;
    padding: 4px;
    position: relative;
  }

  .setup-zone canvas {
    display: block;
    width: 100%;
    height: auto;
    max-height: 22vh;
    object-fit: contain;
    margin: 0 auto;
  }

  .zone-label {
    position: absolute;
    top: 6px;
    left: 10px;
    color: #4fc3f7;
    font-size: 0.62em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: bold;
    opacity: 0.85;
    z-index: 2;
    background: rgba(0,0,0,0.5);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Écran + Profil côte à côte */
  .obs-zone {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    flex: 1;
    min-height: 0;
  }

  .obs-col {
    background: #000;
    border-radius: 8px;
    border: 2px solid #4fc3f7;
    padding: 4px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    position: relative;
  }

  .obs-col canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    margin: 0 auto;
    flex: 1;
    min-height: 0;
  }

  /* ===== BARRE DE CONTRÔLE BASSE ===== */
  .control-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
    padding: 6px 8px;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
  }

  .btn-play {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.85em;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    white-space: nowrap;
    background: linear-gradient(135deg, #4fc3f7, #29b6f6);
    color: #16213e;
    box-shadow: 0 3px 10px rgba(79, 195, 247, 0.4);
  }

  .btn-play:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-play:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-reset-sm {

    border: 1px solid rgba(255,255,255,0.2);

    border-radius: 8px;

    font-size: 0.85em;

<script>
// ============================================================
//  GESTION DES ONGLETS
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    // Redessine les canvas après le changement d'onglet
    setTimeout(() => {
      if (tab.dataset.tab === 'young') {
        render(animationState.progress || 1);
      } else {
        drawPrism(prismAnimation.progress || 1);
      }
    }, 50);
  });
});

// ============================================================
//  PARTIE 1 : FENTES DE YOUNG
// ============================================================
const canvasSetup  = document.getElementById('setupCanvas');
const ctxSetup     = canvasSetup.getContext('2d');
const canvasScreen = document.getElementById('screenCanvas');
const ctxScreen    = canvasScreen.getContext('2d');
const canvasCurve  = document.getElementById('curveCanvas');
const ctxCurve     = canvasCurve.getContext('2d');

const inputs = {
  lambda: document.getElementById('lambda'),
  a: document.getElementById('a'),
  b: document.getElementById('b'),
  D: document.getElementById('D')
};

const statusEl    = document.getElementById('status');
const startBtn    = document.getElementById('startBtn');
const lambdaGroup = document.getElementById('lambdaGroup');

let currentSource = 'mono';
let animationState = {
  running: false, progress: 0, startTime: 0, duration: 3000, rafId: null
};

function gaussian(x, mu, sigma) {
  return Math.exp(-((x - mu) ** 2) / (2 * sigma ** 2));
}

function getSpectrum(source, monoLambda) {
  switch (source) {
    case 'mono': return [{ wl: monoLambda, weight: 1 }];
    case 'white': {
      const s = [];
      for (let wl = 380; wl <= 750; wl += 5) {
        s.push({ wl, weight: gaussian(wl, 555, 90) * 0.7 + 0.3 });
      }
      return s;
    }
    case 'sodium': {
      const s = [];
      for (let wl = 570; wl <= 610; wl += 1) {
        const w = gaussian(wl, 589, 1.5) + gaussian(wl, 589.6, 1.5);
        if (w > 0.01) s.push({ wl, weight: w });
      }
      return s;
    }
    case 'mercury': {
      const raies = [
        { wl: 404.7, amp: 0.5 }, { wl: 435.8, amp: 0.8 },
        { wl: 546.1, amp: 1.0 }, { wl: 577.0, amp: 0.6 }, { wl: 579.1, amp: 0.6 }
      ];
      const s = [];
      for (let wl = 380; wl <= 650; wl += 1) {
        let w = 0;
        raies.forEach(r => { w += r.amp * gaussian(wl, r.wl, 2); });
        if (w > 0.01) s.push({ wl, weight: w });
      }
      return s;
    }
    case 'rgb':
      return [{ wl: 610, weight: 1 }, { wl: 545, weight: 1 }, { wl: 465, weight: 1 }];
  }
  return [{ wl: monoLambda, weight: 1 }];
}

function wavelengthToRGB(wl) {
  let R, G, B;
  if (wl >= 380 && wl < 440) { R = -(wl-440)/(440-380); G = 0; B = 1; }
  else if (wl < 490) { R = 0; G = (wl-440)/(490-440); B = 1; }
  else if (wl < 510) { R = 0; G = 1; B = -(wl-510)/(510-490); }
  else if (wl < 580) { R = (wl-510)/(580-510); G = 1; B = 0; }
  else if (wl < 645) { R = 1; G = -(wl-645)/(645-580); B = 0; }
  else if (wl <= 780) { R = 1; G = 0; B = 0; }
  else { R = G = B = 0; }
  let f;
  if (wl >= 380 && wl < 420) f = 0.3 + 0.7*(wl-380)/(420-380);
  else if (wl < 701) f = 1;
  else f = 0.3 + 0.7*(780-wl)/(780-700);
  return [
    Math.round(255 * Math.pow(R * f, 0.8)),
    Math.round(255 * Math.pow(G * f, 0.8)),
    Math.round(255 * Math.pow(B * f, 0.8))
  ];
}

function updateLabels() {
  document.getElementById('lamVal').textContent = inputs.lambda.value + ' nm';
  document.getElementById('aVal').textContent = parseFloat(inputs.a.value).toFixed(2) + ' mm';
  document.getElementById('bVal').textContent = parseFloat(inputs.b.value).toFixed(2) + ' mm';
  document.getElementById('dVal').textContent = parseFloat(inputs.D.value).toFixed(2) + ' m';
}

function intensityAt(x, spectrum, a, b, D) {
  let R = 0, G = 0, B = 0, wTotal = 0;
  for (let i = 0; i < spectrum.length; i++) {
    const { wl, weight } = spectrum[i];
    const lam = wl * 1e-9;
    const phase = Math.PI * a * x / (lam * D);
    const interference = Math.cos(phase) ** 2;
    let diffract = 1;
    if (b > 0) {
      const beta = Math.PI * b * x / (lam * D);
      diffract = beta === 0 ? 1 : (Math.sin(beta) / beta) ** 2;
    }
    const I = interference * diffract * weight;
    const [r, g, bl] = wavelengthToRGB(wl);
    R += r * I; G += g * I; B += bl * I; wTotal += weight;
  }
  if (wTotal > 0) { R /= wTotal; G /= wTotal; B /= wTotal; }
  return { R, G, B };
}

function scalarIntensityAt(x, spectrum, a, b, D) {
  const { R, G, B } = intensityAt(x, spectrum, a, b, D);
  return (R + G + B) / 3 / 255;
}

function getAverageColor(spectrum) {
  let R = 0, G = 0, B = 0, wT = 0;
  spectrum.forEach(({ wl, weight }) => {
    const [r, g, b] = wavelengthToRGB(wl);
    R += r * weight; G += g * weight; B += b * weight; wT += weight;
  });
  if (wT > 0) { R /= wT; G /= wT; B /= wT; }
  return [Math.round(R), Math.round(G), Math.round(B)];
}

function getLambdaMoy(spectrum) {
  return spectrum.reduce((s, c) => s + c.wl * c.weight, 0) / spectrum.reduce((s, c) => s + c.weight, 0);
}

// ---------- DISPOSITIF (canvas large et compact) ----------
function drawSetup(spectrum, a, b, D, progress) {
  const [r, g, bl] = getAverageColor(spectrum);
  const W = canvasSetup.width, H = canvasSetup.height;
  ctxSetup.clearRect(0, 0, W, H);
  ctxSetup.fillStyle = '#0a0a1a';
  ctxSetup.fillRect(0, 0, W, H);

  const laserX = 80, fenteX = 600, ecranX = 1300, axisY = H / 2;
  const scaleA = 260;
  const aNorm = a / 1e-3, bNorm = b / 1e-3;
  const sepPx = Math.max(24, aNorm * scaleA);
  const widthPx = Math.max(3, bNorm * scaleA * 0.6);
  const barWidth = 12;
  const topBar = axisY - sepPx/2 - widthPx/2;
  const botBar = axisY + sepPx/2 + widthPx/2;
  const s1 = { x: fenteX + barWidth/2, y: axisY - sepPx/2 };
  const s2 = { x: fenteX + barWidth/2, y: axisY + sepPx/2 };

  const distLaserFente = fenteX - 20 - (laserX + 55);
  const progLaser = Math.min(1, progress * 2);
  const xFrontLaser = (laserX + 55) + distLaserFente * progLaser;

  if (progLaser > 0) {
    ctxSetup.fillStyle = `rgba(${r},${g},${bl},0.25)`;
    ctxSetup.beginPath();
    ctxSetup.moveTo(laserX + 55, axisY - 8);
    ctxSetup.lineTo(xFrontLaser, axisY - 8);
    ctxSetup.lineTo(xFrontLaser, axisY + 8);
    ctxSetup.lineTo(laserX + 55, axisY + 8);
    ctxSetup.closePath();
    ctxSetup.fill();
    for (let i = 0; i < 5; i++) {
      const t = ((progress * 3) + i / 5) % 1;
      const px = (laserX + 55) + distLaserFente * t;
      if (px < xFrontLaser) {
        ctxSetup.fillStyle = `rgba(${r},${g},${bl},0.9)`;
        ctxSetup.beginPath();
        ctxSetup.arc(px, axisY, 2.5, 0, Math.PI * 2);
        ctxSetup.fill();
      }
    }
  }

  ctxSetup.fillStyle = '#2a2a3e';
  ctxSetup.strokeStyle = '#4fc3f7';
  ctxSetup.lineWidth = 2;
  ctxSetup.beginPath();
  ctxSetup.roundRect(laserX - 55, axisY - 18, 110, 36, 6);
  ctxSetup.fill();
  ctxSetup.stroke();
  ctxSetup.fillStyle = `rgb(${r},${g},${bl})`;
  ctxSetup.beginPath();
  ctxSetup.arc(laserX + 35, axisY, 5, 0, Math.PI * 2);
  ctxSetup.fill();

  ctxSetup.fillStyle = '#4fc3f7';
  ctxSetup.font = 'bold 11px monospace';
  ctxSetup.textAlign = 'center';
  ctxSetup.fillText('SOURCE', laserX, axisY + 34);

  ctxSetup.fillStyle = '#3a3a52';
  ctxSetup.strokeStyle = '#4fc3f7';
  ctxSetup.lineWidth = 1.5;
  ctxSetup.beginPath();
  ctxSetup.rect(fenteX - barWidth/2, 10, barWidth, topBar - 10);
  ctxSetup.fill(); ctxSetup.stroke();
  ctxSetup.beginPath();
  ctxSetup.rect(fenteX - barWidth/2, botBar, barWidth, H - 10 - botBar);
  ctxSetup.fill(); ctxSetup.stroke();

  ctxSetup.strokeStyle = `rgb(${r},${g},${bl})`;
  ctxSetup.lineWidth = 2;
  ctxSetup.strokeRect(fenteX - barWidth/2, topBar, barWidth, widthPx);
  ctxSetup.strokeRect(fenteX - barWidth/2, botBar - widthPx, barWidth, widthPx);

  ctxSetup.fillStyle = '#4fc3f7';
  ctxSetup.font = 'bold 11px monospace';
  ctxSetup.fillText('FENTES', fenteX, H - 4);

  const spread = 65;
  const progScreen = Math.max(0, (progress - 0.5) * 2);
  const distFenteEcran = ecranX - s1.x;
  const xFrontScreen = s1.x + distFenteEcran * progScreen;

  if (progScreen > 0) {
    const ratioH = progScreen;
    const isPoly = spectrum.length > 3;
    const colorsToDraw = isPoly
      ? [wavelengthToRGB(450), wavelengthToRGB(550), wavelengthToRGB(650)]
      : [[r, g, bl]];
    colorsToDraw.forEach(([cr, cg, cb]) => {
      const yTopH = s1.y + (axisY - spread - s1.y) * ratioH;
      const yBotH = s1.y + (axisY + spread - s1.y) * ratioH;
      ctxSetup.fillStyle = `rgba(${cr},${cg},${cb},0.08)`;
      ctxSetup.beginPath();
      ctxSetup.moveTo(s1.x, s1.y);
      ctxSetup.lineTo(xFrontScreen, yTopH);
      ctxSetup.lineTo(xFrontScreen, yBotH);
      ctxSetup.closePath();
      ctxSetup.fill();
      const yTopB = s2.y + (axisY - spread - s2.y) * ratioH;
      const yBotB = s2.y + (axisY + spread - s2.y) * ratioH;
      ctxSetup.beginPath();
      ctxSetup.moveTo(s2.x, s2.y);
      ctxSetup.lineTo(xFrontScreen, yTopB);
      ctxSetup.lineTo(xFrontScreen, yBotB);
      ctxSetup.closePath();
      ctxSetup.fill();
    });
    colorsToDraw.forEach(([cr, cg, cb]) => {
      ctxSetup.strokeStyle = `rgba(${cr},${cg},${cb},0.5)`;
      ctxSetup.lineWidth = 1;
      for (let k = -3; k <= 3; k++) {
        const yEnd = axisY + k * (spread / 3.5);
        const yH = s1.y + (yEnd - s1.y) * ratioH;
        ctxSetup.beginPath();
        ctxSetup.moveTo(s1.x, s1.y);
        ctxSetup.lineTo(xFrontScreen, yH);
        ctxSetup.stroke();
        const yB = s2.y + (yEnd - s2.y) * ratioH;
        ctxSetup.beginPath();
        ctxSetup.moveTo(s2.x, s2.y);
        ctxSetup.lineTo(xFrontScreen, yB);
        ctxSetup.stroke();
      }
    });
  }

  ctxSetup.fillStyle = '#1a1a2e';
  ctxSetup.strokeStyle = '#4fc3f7';
  ctxSetup.lineWidth = 2;
  ctxSetup.fillRect(ecranX, 10, 18, H - 20);
  ctxSetup.strokeRect(ecranX, 10, 18, H - 20);
  if (progress >= 1) {
    ctxSetup.fillStyle = `rgba(${r},${g},${bl},0.9)`;
    ctxSetup.fillRect(ecranX, axisY - 22, 18, 44);
  }
  ctxSetup.fillStyle = '#4fc3f7';
  ctxSetup.font = 'bold 11px monospace';
  ctxSetup.fillText('ÉCRAN', ecranX + 9, H - 4);

  // Axe optique
  ctxSetup.strokeStyle = 'rgba(255,255,255,0.2)';
  ctxSetup.setLineDash([5, 5]);
  ctxSetup.beginPath();
  ctxSetup.moveTo(laserX, axisY);
  ctxSetup.lineTo(ecranX, axisY);
  ctxSetup.stroke();
  ctxSetup.setLineDash([]);

  // Cote D
  ctxSetup.strokeStyle = '#ffd54f';
  ctxSetup.fillStyle = '#ffd54f';
  ctxSetup.font = 'bold 10px monospace';
  const yCote = H - 12;
  ctxSetup.beginPath();
  ctxSetup.moveTo(fenteX, yCote - 4);
  ctxSetup.lineTo(fenteX, yCote);
  ctxSetup.lineTo(ecranX + 9, yCote);
  ctxSetup.lineTo(ecranX + 9, yCote - 4);
  ctxSetup.stroke();
  ctxSetup.fillText(`D = ${D.toFixed(2)} m`, (fenteX + ecranX) / 2, yCote - 4);
}

// ---------- ÉCRAN (vertical) ----------
function drawScreen(spectrum, a, b, D, progress) {
  const lamMoy = getLambdaMoy(spectrum) * 1e-9;
  const screenHalfWidth = Math.max((lamMoy * D / a) * 15, 2e-3);
  const W = canvasScreen.width, H = canvasScreen.height;

  ctxScreen.fillStyle = '#000';
  ctxScreen.fillRect(0, 0, W, H);

  const progScreen = Math.max(0, (progress - 0.5) * 2);
  if (progScreen <= 0) return;

  const imgData = ctxScreen.createImageData(W, H);
  for (let py = 0; py < H; py++) {
    const yNorm = (py - H/2) / (H/2);
    const distFromCenter = Math.abs(yNorm);
    if (distFromCenter > progScreen) continue;
    const x = yNorm * screenHalfWidth;
    const c = intensityAt(x, spectrum, a, b, D);
    for (let px = 0; px < W; px++) {
      const idx = (py * W + px) * 4;
      imgData.data[idx]     = c.R;
      imgData.data[idx + 1] = c.G;
      imgData.data[idx + 2] = c.B;
      imgData.data[idx + 3] = 255;
    }
  }
  ctxScreen.putImageData(imgData, 0, 0);

  // Axe central
  ctxScreen.strokeStyle = 'rgba(255,255,255,0.2)';
  ctxScreen.setLineDash([6, 6]);
  ctxScreen.lineWidth = 1;
  ctxScreen.beginPath();
  ctxScreen.moveTo(0, H/2);
  ctxScreen.lineTo(W, H/2);
  ctxScreen.stroke();
  ctxScreen.setLineDash([]);

  // Graduations mm
  ctxScreen.fillStyle = 'rgba(79,195,247,0.7)';
  ctxScreen.font = 'bold 10px monospace';
  ctxScreen.textAlign = 'left';
  for (let k = -3; k <= 3; k++) {
    if (k === 0) continue;
    const xVal_mm = k * (lamMoy * D / a) * 1000;
    const yNorm = (xVal_mm * 1e-3) / screenHalfWidth;
    const py = H/2 + yNorm * H/2;
    if (py > 15 && py < H - 15) {
      ctxScreen.fillText(`${xVal_mm.toFixed(1)}`, W - 32, py + 3);
    }
  }
}

// ---------- COURBE (verticale) ----------
function drawCurve(spectrum, a, b, D, progress) {
  const W = canvasCurve.width, H = canvasCurve.height;
  const lamMoy = getLambdaMoy(spectrum) * 1e-9;
  const screenHalfWidth = Math.max((lamMoy * D / a) * 15, 2e-3);

  ctxCurve.clearRect(0, 0, W, H);
  ctxCurve.fillStyle = '#0a0a1a';
  ctxCurve.fillRect(0, 0, W, H);

  ctxCurve.strokeStyle = 'rgba(79,195,247,0.12)';
  ctxCurve.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const x = i * W / 10;
    ctxCurve.beginPath();
    ctxCurve.moveTo(x, 0);
    ctxCurve.lineTo(x, H);
    ctxCurve.stroke();
  }

  ctxCurve.strokeStyle = 'rgba(255,255,255,0.4)';
  ctxCurve.lineWidth = 1;
  ctxCurve.beginPath();
  ctxCurve.moveTo(8, 0);
  ctxCurve.lineTo(8, H);
  ctxCurve.stroke();

  const progScreen = Math.max(0, (progress - 0.5) * 2);
  if (progScreen <= 0) return;

  const pyMin = H/2 - progScreen * H/2;
  const pyMax = H/2 + progScreen * H/2;

  if (spectrum.length > 3) {
    const samples = [];
    for (let k = 0; k < 7; k++) samples.push(spectrum[Math.floor(k / 7 * spectrum.length)]);
    samples.forEach(({ wl }) => {
      const lam = wl * 1e-9;
      const [r, g, bl] = wavelengthToRGB(wl);
      ctxCurve.strokeStyle = `rgba(${r},${g},${bl},0.35)`;
      ctxCurve.lineWidth = 1;
      ctxCurve.beginPath();
      let started = false;
      for (let py = 0; py < H; py++) {
        if (py < pyMin || py > pyMax) { started = false; continue; }
        const yNorm = (py - H/2) / (H/2);
        const x = yNorm * screenHalfWidth;
        const phase = Math.PI * a * x / (lam * D);
        const interference = Math.cos(phase) ** 2;
        let diffract = 1;
        if (b > 0) {
          const beta = Math.PI * b * x / (lam * D);
          diffract = beta === 0 ? 1 : (Math.sin(beta) / beta) ** 2;
        }
        const I = interference * diffract;
        const px = 8 + I * (W - 16);
        if (!started) { ctxCurve.moveTo(px, py); started = true; }
        else ctxCurve.lineTo(px, py);
      }
      ctxCurve.stroke();
    });
  }

  const [rAvg, gAvg, bAvg] = getAverageColor(spectrum);
  ctxCurve.strokeStyle = `rgb(${rAvg},${gAvg},${bAvg})`;
  ctxCurve.lineWidth = 2;
  ctxCurve.shadowColor = `rgb(${rAvg},${gAvg},${bAvg})`;
  ctxCurve.shadowBlur = 8;

  ctxCurve.beginPath();
  let started = false;
  for (let py = 0; py < H; py++) {
    if (py < pyMin || py > pyMax) { started = false; continue; }
    const yNorm = (py - H/2) / (H/2);
    const x = yNorm * screenHalfWidth;
    const I = scalarIntensityAt(x, spectrum, a, b, D);
    const px = 8 + I * (W - 16);
    if (!started) { ctxCurve.moveTo(px, py); started = true; }
    else ctxCurve.lineTo(px, py);
  }
  ctxCurve.stroke();
  ctxCurve.shadowBlur = 0;

  ctxCurve.strokeStyle = 'rgba(255,255,255,0.2)';
  ctxCurve.setLineDash([6, 6]);
  ctxCurve.lineWidth = 1;
  ctxCurve.beginPath();
  ctxCurve.moveTo(0, H/2);
  ctxCurve.lineTo(W, H/2);
  ctxCurve.stroke();
  ctxCurve.setLineDash([]);
}

function render(progress) {
  const a = parseFloat(inputs.a.value) * 1e-3;
  const b = parseFloat(inputs.b.value) * 1e-3;
  const D = parseFloat(inputs.D.value);
  const monoLambda = parseFloat(inputs.lambda.value);
  const spectrum = getSpectrum(currentSource, monoLambda);

  drawSetup(spectrum, a, b, D, progress);
  drawScreen(spectrum, a, b, D, progress);
  drawCurve(spectrum, a, b, D, progress);

  const lamMoy = getLambdaMoy(spectrum) * 1e-9;
  const interfrange_mm = (lamMoy * D / a) * 1e3;
  const centralWidth_mm = (2 * lamMoy * D / b) * 1e3;
  const nbFranges = Math.floor(2 * lamMoy * D / (b * (lamMoy * D / a))) * 2 + 1;

  document.getElementById('interfrange').textContent = interfrange_mm.toFixed(3) + ' mm';
  document.getElementById('centralWidth').textContent = centralWidth_mm.toFixed(2) + ' mm';
  document.getElementById('nbFranges').textContent = isFinite(nbFranges) ? nbFranges : '∞';
}

function startExperiment() {
  if (animationState.running) return;
  animationState.running = true;
  animationState.progress = 0;
  animationState.startTime = performance.now();
  startBtn.disabled = true;
  setControlsEnabled(false);
  statusEl.textContent = "💡 Propagation...";
  statusEl.classList.add('active');

  function animate(now) {
    const elapsed = now - animationState.startTime;
    const p = Math.min(1, elapsed / animationState.duration);
    animationState.progress = p;
    render(p);
    if (p < 0.5) statusEl.textContent = "💡 Lumière vers les fentes...";
    else if (p < 1) statusEl.textContent = "🌊 Traversée et propagation...";
    else statusEl.textContent = "✅ Interférences formées !";
    if (p < 1) animationState.rafId = requestAnimationFrame(animate);
    else {
      animationState.running = false;
      startBtn.disabled = false;
      startBtn.innerHTML = '▶ Rejouer';
      setControlsEnabled(true);
    }
  }
  animationState.rafId = requestAnimationFrame(animate);
}

function setControlsEnabled(enabled) {
  Object.values(inputs).forEach(inp => inp.disabled = !enabled);
}

function resetAll() {
  if (animationState.rafId) cancelAnimationFrame(animationState.rafId);
  animationState.running = false;
  animationState.progress = 0;
  inputs.lambda.value = 500;
  inputs.a.value = 0.5;
  inputs.b.value = 0.1;
  inputs.D.value = 1;
  updateLabels();
  setControlsEnabled(true);
  startBtn.disabled = false;
  startBtn.innerHTML = '▶ Démarrer';
  statusEl.textContent = "Prêt à démarrer l'expérience";
  statusEl.classList.remove('active');
  render(0);
}

document.querySelectorAll('#sourcePicker .src-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#sourcePicker .src-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSource = btn.dataset.source;
    if (currentSource === 'mono') {
      lambdaGroup.classList.remove('disabled');
      inputs.lambda.disabled = false;
    } else {
      lambdaGroup.classList.add('disabled');
      inputs.lambda.disabled = true;
    }
    if (!animationState.running) {
      animationState.progress = 1;
      render(1);
      startBtn.innerHTML = '▶ Rejouer';
    }
  });
});

Object.values(inputs).forEach(input => {
  input.addEventListener('input', () => {
    updateLabels();
    if (!animationState.running) render(animationState.progress);
  });
});

// ============================================================
//  PARTIE 2 : PRISME
// ============================================================
const canvasPrism = document.getElementById('prismCanvas');
const ctxPrism = canvasPrism.getContext('2d');

const prismInputs = {
  angle: document.getElementById('prismAngle'),
  nR: document.getElementById('prismNR'),
  nV: document.getElementById('prismNV'),
  inc: document.getElementById('prismInc')
};

const prismStatusEl = document.getElementById('prismStatus');
const prismStartBtn = document.getElementById('prismStartBtn');

let currentPrismSource = 'white';
let prismAnimation = {
  running: false, progress: 0, startTime: 0, duration: 2500, rafId: null
};

function getGlassIndex(wl, nR, nV) {
  const lR = 650, lV = 400;
  const A = (nR * lR * lR - nV * lV * lV) / (lR * lR - lV * lV);
  const B = (nR - nV) * lR * lR * lV * lV / (lV * lV - lR * lR);
  return A + B / (wl * wl);
}

function computePrismPath(incidence_deg, apexAngle_deg, n) {
  const i1 = incidence_deg * Math.PI / 180;
  const A = apexAngle_deg * Math.PI / 180;
  const sin_r1 = Math.sin(i1) / n;
  if (sin_r1 > 1 || sin_r1 < -1) return { valid: false };
  const r1 = Math.asin(sin_r1);
  const r2 = A - r1;
  const sin_i2 = n * Math.sin(r2);
  if (sin_i2 > 1 || sin_i2 < -1) return { valid: false };
  const i2 = Math.asin(sin_i2);
  const deviation = (i1 + i2 - A) * 180 / Math.PI;
  return { valid: true, deviation };
}

function drawPrism(progress) {
  const W = canvasPrism.width, H = canvasPrism.height;
  ctxPrism.clearRect(0, 0, W, H);
  ctxPrism.fillStyle = '#0a0a1a';
  ctxPrism.fillRect(0, 0, W, H);

  const A_deg = parseFloat(prismInputs.angle.value);
  const nR = parseFloat(prismInputs.nR.value);
  const nV = parseFloat(prismInputs.nV.value);
  const inc = parseFloat(prismInputs.inc.value);

  const cx = W / 2;
  const cy = H / 2 + 20;
  const size = 140;
  const A = A_deg * Math.PI / 180;

  const apexX = cx;
  const apexY = cy - size * 0.75;
  const halfBase = size * Math.sin(A / 2) * 1.6;
  const baseY = cy + size * 0.75;
  const leftX = cx - halfBase;
  const rightX = cx + halfBase;

  const sourceX = 60;
  const sourceY = cy;

  let srcColor = [255, 255, 255];
  if (currentPrismSource === 'red') srcColor = [255, 40, 40];
  else if (currentPrismSource === 'green') srcColor = [40, 255, 40];
  else if (currentPrismSource === 'blue') srcColor = [40, 100, 255];

  const tEntry = 0.55;
  const entryX = apexX + (leftX - apexX) * tEntry;
  const entryY = apexY + (baseY - apexY) * tEntry;

  const progInc = Math.min(1, progress / 0.35);
  const srcX = sourceX;
  const srcY = sourceY;
  const endX = srcX + (entryX - srcX) * progInc;
  const endY = srcY + (entryY - srcY) * progInc;

  const gradIn = ctxPrism.createLinearGradient(srcX, srcY, entryX, entryY);
  gradIn.addColorStop(0, `rgba(${srcColor[0]},${srcColor[1]},${srcColor[2]},0.3)`);
  gradIn.addColorStop(1, `rgba(${srcColor[0]},${srcColor[1]},${srcColor[2]},1)`);
  ctxPrism.strokeStyle = gradIn;
  ctxPrism.lineWidth = 3;
  ctxPrism.shadowColor = `rgb(${srcColor[0]},${srcColor[1]},${srcColor[2]})`;
  ctxPrism.shadowBlur = 10;
  ctxPrism.beginPath();
  ctxPrism.moveTo(srcX, srcY);
  ctxPrism.lineTo(endX, endY);
  ctxPrism.stroke();
  ctxPrism.shadowBlur = 0;

  ctxPrism.fillStyle = '#2a2a3e';
  ctxPrism.strokeStyle = '#4fc3f7';
  ctxPrism.lineWidth = 2;
  ctxPrism.beginPath();
  ctxPrism.roundRect(srcX - 45, srcY - 22, 90, 44, 8);
  ctxPrism.fill();
  ctxPrism.stroke();
  ctxPrism.fillStyle = `rgb(${srcColor[0]},${srcColor[1]},${srcColor[2]})`;
  ctxPrism.beginPath();
  ctxPrism.arc(srcX + 30, srcY, 6, 0, Math.PI * 2);
  ctxPrism.fill();

  ctxPrism.fillStyle = '#4fc3f7';
  ctxPrism.font = 'bold 13px monospace';
  ctxPrism.textAlign = 'center';
  ctxPrism.fillText('SOURCE', srcX, srcY + 50);

  ctxPrism.fillStyle = 'rgba(100,180,255,0.12)';
  ctxPrism.strokeStyle = '#4fc3f7';
  ctxPrism.lineWidth = 2.5;
  ctxPrism.beginPath();
  ctxPrism.moveTo(apexX, apexY);
  ctxPrism.lineTo(leftX, baseY);
  ctxPrism.lineTo(rightX, baseY);
  ctxPrism.closePath();
  ctxPrism.fill();
  ctxPrism.stroke();

  ctxPrism.fillStyle = '#4fc3f7';
  ctxPrism.font = 'bold 13px monospace';
  ctxPrism.fillText('PRISME', cx, apexY - 15);

  ctxPrism.strokeStyle = '#ffd54f';
  ctxPrism.lineWidth = 1.5;
  ctxPrism.beginPath();
  ctxPrism.arc(apexX, apexY, 30, Math.PI/2 - A/2, Math.PI/2 + A/2);
  ctxPrism.stroke();
  ctxPrism.fillStyle = '#ffd54f';
  ctxPrism.font = 'bold 12px monospace';
  ctxPrism.fillText(`A = ${A_deg}°`, cx, apexY + 38);

  let wavelengths = [];
  if (currentPrismSource === 'white') {
    for (let wl = 400; wl <= 680; wl += 20) wavelengths.push(wl);
  } else if (currentPrismSource === 'red') wavelengths = [650];
  else if (currentPrismSource === 'green') wavelengths = [532];
  else if (currentPrismSource === 'blue') wavelengths = [450];

  const rayons = wavelengths.map(wl => {
    const n = getGlassIndex(wl, nR, nV);
    const path = computePrismPath(inc, A_deg, n);
    return { wl, n, path };
  });

  const progIn = Math.max(0, Math.min(1, (progress - 0.35) / 0.30));
  const progOut = Math.max(0, Math.min(1, (progress - 0.65) / 0.35));

  const faceLeftAngle = Math.atan2(baseY - apexY, leftX - apexX);

  wavelengths.forEach((wl, idx) => {
    const { path } = rayons[idx];
    if (!path.valid) return;
    const [rr, gg, bb] = wavelengthToRGB(wl);
    const isWhite = currentPrismSource === 'white';

    const entryOffset = isWhite ? (1 - (wl - 400) / 300) * 8 : 0;
    const eX = entryX + entryOffset * Math.cos(faceLeftAngle);
    const eY = entryY + entryOffset * Math.sin(faceLeftAngle);

    const tExit = 0.55 + (isWhite ? ((650 - wl) / 500) * 0.1 : 0);
    const exitX = apexX + (rightX - apexX) * tExit;
    const exitY = apexY + (baseY - apexY) * tExit;

    if (progIn > 0) {
      const midX = eX + (exitX - eX) * progIn;
      const midY = eY + (exitY - eY) * progIn;
      ctxPrism.strokeStyle = `rgba(${rr},${gg},${bb},${isWhite ? 0.85 : 1})`;
      ctxPrism.lineWidth = isWhite ? 2 : 3;
      if (!isWhite) {
        ctxPrism.shadowColor = `rgb(${rr},${gg},${bb})`;
        ctxPrism.shadowBlur = 12;
      }
      ctxPrism.beginPath();
      ctxPrism.moveTo(eX, eY);
      ctxPrism.lineTo(midX, midY);
      ctxPrism.stroke();
      if (!isWhite) ctxPrism.shadowBlur = 0;
    }

    if (progOut > 0) {
      const devRad = path.deviation * Math.PI / 180;
      const finalLength = 380;
      const endOutX = exitX + finalLength * Math.cos(devRad);
      const endOutY = exitY + finalLength * Math.sin(devRad);
      const midOutX = exitX + (endOutX - exitX) * progOut;
      const midOutY = exitY + (endOutY - exitY) * progOut;

      ctxPrism.strokeStyle = `rgba(${rr},${gg},${bb},${isWhite ? 0.85 : 1})`;
      ctxPrism.lineWidth = isWhite ? 2.5 : 3.5;
      if (!isWhite) {
        ctxPrism.shadowColor = `rgb(${rr},${gg},${bb})`;
        ctxPrism.shadowBlur = 14;
      }
      ctxPrism.beginPath();
      ctxPrism.moveTo(exitX, exitY);
      ctxPrism.lineTo(midOutX, midOutY);
      ctxPrism.stroke();
      if (!isWhite) ctxPrism.shadowBlur = 0;
    }
  });

  const screenX = W - 60;
  ctxPrism.fillStyle = '#1a1a2e';
  ctxPrism.strokeStyle = '#4fc3f7';
  ctxPrism.lineWidth = 2;
  ctxPrism.fillRect(screenX, 20, 20, H - 40);
  ctxPrism.strokeRect(screenX, 20, 20, H - 40);

  if (progress >= 0.95 && currentPrismSource === 'white') {
    wavelengths.forEach((wl, idx) => {
      const { path } = rayons[idx];
      if (!path.valid) return;
      const [rr, gg, bb] = wavelengthToRGB(wl);
      const devRad = path.deviation * Math.PI / 180;
      const tExit = 0.55 + ((650 - wl) / 500) * 0.1;
      const exitX = apexX + (rightX - apexX) * tExit;
      const exitY = apexY + (baseY - apexY) * tExit;
      const finalLength = 380;
      const endOutX = exitX + finalLength * Math.cos(devRad);
      const tToScreen = (screenX - exitX) / (endOutX - exitX);
      const yOnScreen = exitY + (finalLength * Math.sin(devRad)) * tToScreen;

      const gradient = ctxPrism.createRadialGradient(screenX + 10, yOnScreen, 2, screenX + 10, yOnScreen, 15);
      gradient.addColorStop(0, `rgba(${rr},${gg},${bb},0.9)`);
      gradient.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
      ctxPrism.fillStyle = gradient;
      ctxPrism.beginPath();
      ctxPrism.arc(screenX + 10, yOnScreen, 15, 0, Math.PI * 2);
      ctxPrism.fill();
    });
  }

  ctxPrism.fillStyle = '#4fc3f7';
  ctxPrism.font = 'bold 13px monospace';
  ctxPrism.textAlign = 'center';
  ctxPrism.fillText('ÉCRAN', screenX + 10, 15);
}

function updatePrismInfo() {
  const A_deg = parseFloat(prismInputs.angle.value);
  const nR = parseFloat(prismInputs.nR.value);
  const nV = parseFloat(prismInputs.nV.value);
  const inc = parseFloat(prismInputs.inc.value);

  const pathR = computePrismPath(inc, A_deg, nR);
  const pathV = computePrismPath(inc, A_deg, nV);

  document.getElementById('devR').textContent = pathR.valid ? pathR.deviation.toFixed(2) + '°' : '—';
  document.getElementById('devV').textContent = pathV.valid ? pathV.deviation.toFixed(2) + '°' : '—';
  if (pathR.valid && pathV.valid) {
    document.getElementById('disp').textContent = (pathV.deviation - pathR.deviation).toFixed(2) + '°';
  } else {
    document.getElementById('disp').textContent = '—';
  }
}

function updatePrismLabels() {
  document.getElementById('angleVal').textContent = prismInputs.angle.value + '°';
  document.getElementById('nRVal').textContent = parseFloat(prismInputs.nR.value).toFixed(3);
  document.getElementById('nVVal').textContent = parseFloat(prismInputs.nV.value).toFixed(3);
  document.getElementById('incVal').textContent = prismInputs.inc.value + '°';
}

function startPrismExperiment() {
  if (prismAnimation.running) return;
  prismAnimation.running = true;
  prismAnimation.progress = 0;
  prismAnimation.startTime = performance.now();
  prismStartBtn.disabled = true;
  Object.values(prismInputs).forEach(i => i.disabled = true);
  prismStatusEl.classList.add('active');

  function animate(now) {
    const elapsed = now - prismAnimation.startTime;
    const p = Math.min(1, elapsed / prismAnimation.duration);
    prismAnimation.progress = p;
    drawPrism(p);

    if (p < 0.35) prismStatusEl.textContent = "💡 Rayon vers le prisme...";
    else if (p < 0.65) prismStatusEl.textContent = "🔺 Réfraction dans le prisme...";
    else if (p < 0.95) prismStatusEl.textContent = "🌈 Décomposition !";
    else prismStatusEl.textContent = "✅ Spectre sur l'écran !";

    if (p < 1) prismAnimation.rafId = requestAnimationFrame(animate);
    else {
      prismAnimation.running = false;
      prismStartBtn.disabled = false;
      prismStartBtn.innerHTML = '▶ Rejouer';
      Object.values(prismInputs).forEach(i => i.disabled = false);
    }
  }
  prismAnimation.rafId = requestAnimationFrame(animate);
}

function resetPrism() {
  if (prismAnimation.rafId) cancelAnimationFrame(prismAnimation.rafId);
  prismAnimation.running = false;
  prismAnimation.progress = 0;
  prismInputs.angle.value = 60;
  prismInputs.nR.value = 1.51;
  prismInputs.nV.value = 1.53;
  prismInputs.inc.value = 45;
  updatePrismLabels();
  updatePrismInfo();
  Object.values(prismInputs).forEach(i => i.disabled = false);
  prismStartBtn.disabled = false;
  prismStartBtn.innerHTML = '▶ Démarrer';
  prismStatusEl.textContent = "Prêt à démarrer";
  prismStatusEl.classList.remove('active');
  drawPrism(0);
}

document.querySelectorAll('#prismSourcePicker .src-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#prismSourcePicker .src-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPrismSource = btn.dataset.psource;
    if (!prismAnimation.running) {
      prismAnimation.progress = 1;
      drawPrism(1);
      prismStartBtn.innerHTML = '▶ Rejouer';
    }
  });
});

Object.values(prismInputs).forEach(input => {
  input.addEventListener('input', () => {
    updatePrismLabels();
    updatePrismInfo();
    if (!prismAnimation.running) drawPrism(prismAnimation.progress);
  });
});

// Polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

window.addEventListener('load', () => document.body.classList.add('loaded'));

updateLabels();
updatePrismLabels();
updatePrismInfo();
render(0);
drawPrism(0);
</script>
