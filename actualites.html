<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualités — LFAKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A; --ink-deep: #10192E; --paper: #F7F5F0; --brass: #A8853F;
    --slate: #5B6472; --text: #1A1A1A; --line: rgba(27,42,74,0.14);
    --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--sans); color: var(--text); background: #f9f7f2; line-height:1.55; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 24px; }

  /* HEADER */
  header { background: var(--paper); border-bottom: 1px solid var(--line); height: 84px; display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; }
  .nav-row { display:flex; align-items:center; justify-content:space-between; width: 100%; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration: none; min-width: 0; }
  .brand-mark { width:45px; height:45px; flex-shrink: 0; display:flex; align-items:center; justify-content:center; } .brand-mark img { width:100%; height:100%; object-fit:contain; }
  .brand-name { font-family:var(--serif); font-weight:700; font-size:18px; color:var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav ul { display:flex; gap:20px; list-style:none; align-items: center; }
  nav a { font-size:14px; font-weight:600; color:var(--ink); text-decoration: none; }
  nav a:hover, nav a.active { color: var(--brass); }
  .nav-cta { background: var(--ink-deep); color:#fff; padding:10px 18px; border-radius:4px; font-size:13px; font-weight:600; text-decoration:none; border:none; cursor:pointer; }
  .menu-toggle { display: none; font-size: 28px; background: none; border: none; color: var(--ink); cursor: pointer; padding: 4px 8px; flex-shrink: 0; }

  @media (max-width: 900px) {
    .brand-name { font-size: 15px; max-width: 46vw; }
    .menu-toggle { display: block; }
    nav ul {
      display: none; position: absolute; top: 84px; left: 0; width: 100%;
      flex-direction: column; background: #fff; padding: 20px; gap: 15px;
      text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-bottom: 2px solid var(--line);
    }
    nav ul.show { display: flex; }
  }

  /* HERO */
  .page-hero { background: var(--ink-deep); color: #fff; padding: 60px 0; text-align: center; }
  .page-hero h1 { font-family: var(--serif); font-size: 32px; margin-bottom: 10px; }

  /* GRID */
  section { padding: 60px 0; }
  .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
  .news-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
  .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
  .news-img { width: 100%; height: 200px; background: #eee; object-fit: cover; }
  .news-body { padding: 25px; flex: 1; }
  .news-date { font-size: 12px; color: var(--brass); font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: block; }
  .news-card h3 { font-family: var(--serif); color: var(--ink); margin-bottom: 12px; font-size: 20px; }
  .news-card p { color: var(--slate); font-size: 14px; line-height: 1.6; }

  footer { background: var(--ink-deep); color: #B7BCC9; padding: 40px; text-align: center; font-size: 13px; margin-top: 50px; }
</style>
</head>
<body>

<header><div class="wrap nav-row"><a href="index.html" class="brand"><div class="brand-mark"><img src="logo-header.png" alt="LFAKM"></div><div class="brand-name">Lycée Franco Arabe de Keur Madiabel</div></a><nav><ul id="main-menu"><li><a href="index.html">Accueil</a></li><li><a href="historique.html">Historique</a></li><li><a href="actualites.html" class="active">Actualités</a></li><li><a href="ressources.html">Ressources</a></li><li><a href="#" id="auth-link" class="nav-cta">Connexion</a></li></ul></nav><button class="menu-toggle" id="menu-toggle-btn" aria-label="Menu">☰</button></div></header>

<section class="page-hero"><div class="wrap"><h1>Vie de l'Établissement</h1><p style="color: #C7CBD6;">Suivez les événements et les actualités du Lycée Franco Arabe.</p></div></section>

<section class="wrap">
  <div class="news-grid" id="news-container">
    <!-- Message de chargement -->
    <div style="text-align: center; color: var(--slate); width: 100%;">Chargement des actualités...</div>
  </div>
</section>

<footer>© 2026 Lycée Franco Arabe de Keur Madiabel<div id="public-contact" style="margin-top: 12px;"></div></footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyAFsr_yfl_T5CrxfgD7Xe5bIw3zN6rIdag", authDomain: "lfakm-87dec.firebaseapp.com", projectId: "lfakm-87dec", storageBucket: "lfakm-87dec.firebasestorage.app", messagingSenderId: "739517262614", appId: "1:739517262614:web:14abd3538427960c527e37" };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  document.getElementById('menu-toggle-btn').onclick = () => document.getElementById('main-menu').classList.toggle('show');

  getDoc(doc(db, 'config', 'contact')).then(snap => {
    if (!snap.exists()) return;
    const c = snap.data();
    if (!c.email && !c.telephone) return;
    document.getElementById('public-contact').innerHTML = `
      Contacter le Proviseur${c.nom ? ' — ' + c.nom : ''} :
      ${c.telephone ? `<a href="tel:${c.telephone}" style="color:#fff;text-decoration:underline;margin-left:8px;">${c.telephone}</a>` : ''}
      ${c.email ? `<a href="mailto:${c.email}" style="color:#fff;text-decoration:underline;margin-left:8px;">${c.email}</a>` : ''}
    `;
  });

  // Charger les actualités depuis Firestore (Collection : actualites), filtrées selon le rôle
  const container = document.getElementById('news-container');
  const q = query(collection(db, "actualites"), orderBy("date", "desc"));
  let currentRole = null; // null = visiteur non connecté

  function renderNews(snapshot) {
    const visible = [];
    snapshot.forEach((doc) => {
      const news = doc.data();
      const dest = news.destinataire || 'tous';
      if (dest === 'tous' || dest === currentRole) visible.push(news);
    });

    if (visible.length === 0) {
        container.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">Aucune actualité pour le moment.</p>`;
        return;
    }
    container.innerHTML = '';
    visible.forEach((news) => {
      const date = news.date?.toDate ? news.date.toDate().toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'}) : news.date;

      container.innerHTML += `
        <article class="news-card">
          ${news.image ? `<img src="${news.image}" class="news-img" alt="image">` : ''}
          <div class="news-body">
            <span class="news-date">${date}</span>
            <h3>${news.titre}</h3>
            <p>${news.contenu}</p>
          </div>
        </article>
      `;
    });
  }

  let latestSnapshot = null;
  onSnapshot(q, (snapshot) => {
    latestSnapshot = snapshot;
    renderNews(snapshot);
  });

  onAuthStateChanged(auth, async (user) => {
    const link = document.getElementById('auth-link');
    if (user) {
      link.textContent = "Déconnexion";
      link.onclick = () => signOut(auth).then(() => location.reload());
      const profSnap = await getDoc(doc(db, 'utilisateurs', user.uid));
      currentRole = profSnap.exists() ? profSnap.data().role : null;
    } else {
      link.textContent = "Connexion";
      link.href = "identification.html";
      currentRole = null;
    }
    if (latestSnapshot) renderNews(latestSnapshot);
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('Service worker non enregistré :', err));
    });
  }
</script>
</body>
</html>
